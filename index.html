    <script>
      // Filter benign Vite websocket / HMR warnings in sandboxed preview iframe
      (function() {
        const filterVite = function(method) {
          const original = console[method];
          console[method] = function(...args) {
            if (args.length > 0 && typeof args[0] === 'string' && args[0].includes('[vite]')) {
              return;
            }
            original.apply(console, args);
          };
        };
        filterVite('error');
        filterVite('warn');
      })();
    </script>
